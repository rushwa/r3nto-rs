[workspace]
members = ["crates/core", "crates/api", "crates/web", "crates/admin"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full", "macros"] }

# Web framework
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower-sessions = "0.12"
tower-sessions-redis-store = "0.12"

# Frontend
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-router = "0.7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
sea-orm = { version = "1.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication & Security
argon2 = "0.5"
jsonwebtoken = "9.3"
ring = "0.17"
rand = "0.8"

# Validation
validator = { version = "0.18", features = ["derive"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
rust_decimal = { version = "1.35", features = ["db-postgres", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

# OpenAPI / Docs
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }

# OAuth (Google, GitHub, Facebook)
openidconnect = "3.5"

# Task Queue (replaces Celery)
apalis = { version = "0.5", features = ["redis", "cron"] }

# Image processing (replaces Pillow)
image = "0.25"

# Random (WASM support)
getrandom = { version = "0.3", features = ["wasm_js"] }

# Config & Env
config = "0.14"
dotenvy = "0.15"

# Shared types across crates
rento-core = { path = "crates/core" }
