[package]
name = "rento-admin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rento-admin"
path = "src/main.rs"

[lib]
name = "rento_admin"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-logger = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "HtmlVideoElement",
    "MediaDevices",
    "MediaStream",
    "Navigator", ] }
js-sys = "0.3"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
gloo-net = "0.6"
gloo-timers = "0.3.0"
